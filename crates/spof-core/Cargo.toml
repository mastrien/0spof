[package]
name = "spof-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
sha2.workspace = true
rusqlite.workspace = true
reqwest.workspace = true
tokio.workspace = true
scraper.workspace = true
getrandom = "0.2"
zip = { version = "9.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tiny_http = { version = "0.12", optional = true }
local-ip-address = { version = "0.6", optional = true }
qrcode = { version = "0.14", default-features = false, features = ["svg"], optional = true }

[features]
# Servidor de sincronização (app desktop e CLI).
server = ["dep:tiny_http", "dep:local-ip-address", "dep:qrcode"]

[dev-dependencies]
tempfile.workspace = true
