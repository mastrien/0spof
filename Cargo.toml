[workspace]
resolver = "2"
members = [
    "crates/spof-core",
    "crates/spof-cli",
    "crates/spof-desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["0spof contributors"]
license = "MIT"
repository = "https://github.com/mastrien/0spof"

[workspace.dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
tokio = { version = "1.43", features = ["full"] }
rusqlite = { version = "0.33", features = ["bundled", "chrono"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies"] }
clap = { version = "4.5", features = ["derive"] }
tempfile = "3.17"
tauri = { version = "2.2", features = [] }
tauri-build = { version = "2.0", features = [] }
scraper = "0.22"
