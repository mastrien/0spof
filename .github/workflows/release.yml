name: Release

# Para publicar: `python scripts/version.py X.Y.Z`, commit, `git tag vX.Y.Z`, `git push --tags`.
# O release nasce como rascunho e só é publicado quando todos os artefatos subiram,
# porque o app busca a atualização em "releases/latest" e não pode ver uma versão pela metade.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Conferir versão e preparar rascunho
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/version.py --check "${{ github.ref_name }}"
      - name: Criar release em rascunho
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release create "${{ github.ref_name }}" \
              --draft \
              --title "0spof ${{ github.ref_name }}" \
              --generate-notes
          fi

  desktop:
    name: Desktop, CLI e MCP (${{ matrix.platform.asset_name }})
    needs: version
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: windows-latest
            asset_name: windows-x86_64
            is_windows: true
          - os: ubuntu-22.04
            asset_name: linux-x86_64
            is_windows: false
          - os: macos-latest
            asset_name: macos-aarch64
            is_windows: false

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependências WebKitGTK para Tauri (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform.asset_name }}-release

      # Instalador nativo assinado para o updater + latest.json.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: crates/spof-desktop
          tagName: ${{ github.ref_name }}
          releaseName: 0spof ${{ github.ref_name }}
          releaseDraft: true
          includeUpdaterJson: true

      - name: Compilar e enviar CLI e MCP (Windows)
        if: matrix.platform.is_windows
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo build --release -p spof-cli -p spof-mcp
          cp target/release/0spof.exe "0spof-${{ matrix.platform.asset_name }}.exe"
          cp target/release/0spof-mcp.exe "0spof-mcp-${{ matrix.platform.asset_name }}.exe"
          gh release upload "${{ github.ref_name }}" \
            "0spof-${{ matrix.platform.asset_name }}.exe" \
            "0spof-mcp-${{ matrix.platform.asset_name }}.exe" \
            --clobber

      - name: Compilar e enviar CLI e MCP (Unix)
        if: "!matrix.platform.is_windows"
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo build --release -p spof-cli -p spof-mcp
          cp target/release/0spof "0spof-${{ matrix.platform.asset_name }}"
          cp target/release/0spof-mcp "0spof-mcp-${{ matrix.platform.asset_name }}"
          gh release upload "${{ github.ref_name }}" \
            "0spof-${{ matrix.platform.asset_name }}" \
            "0spof-mcp-${{ matrix.platform.asset_name }}" \
            --clobber

  android:
    name: Android (APK)
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-release

      - name: NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" > /dev/null

      # Todas as versões precisam da MESMA chave, senão o Android recusa a atualização.
      - name: Chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 ausente: o APK não pode ser assinado." && exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/0spof-release.jks
          cat > android/key.properties <<EOF
          storeFile=0spof-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEYSTORE_PASSWORD
          EOF

      - run: flutter build apk --release --target-platform android-arm64,android-arm

      - name: Enviar APK
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp build/app/outputs/flutter-apk/app-release.apk "0spof-$version.apk"
          gh release upload "$GITHUB_REF_NAME" "0spof-$version.apk" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publicar
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - run: gh release edit "${{ github.ref_name }}" --repo "$GITHUB_REPOSITORY" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
